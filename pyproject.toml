[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crypto-scanner"
version = "0.1.0"
description = "Independent Bybit Testnet crypto market scanner and automated trading research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
crypto-scanner-public-smoke = "crypto_scanner.smoke_public:main"
crypto-scanner-private-readonly-smoke = "crypto_scanner.smoke_private:main"
crypto-scanner-discovery = "crypto_scanner.run_discovery:main"
crypto-scanner-runtime-preflight = "crypto_scanner.runtime_preflight:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_scanner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
