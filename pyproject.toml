[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crypto-scanner"
version = "0.2.0"
description = "Independent Binance Futures Demo crypto scanner and automated trading research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
crypto-scanner-public-smoke = "crypto_scanner.smoke_public:main"
crypto-scanner-private-readonly-smoke = "crypto_scanner.smoke_private:main"
crypto-scanner-discovery = "crypto_scanner.run_discovery:main"
crypto-scanner-runtime-preflight = "crypto_scanner.runtime_preflight:main"
crypto-scanner-execution-smoke = "crypto_scanner.execution_smoke:main"
crypto-scanner-phase6-audit = "crypto_scanner.phase6_audit:main"
crypto-scanner-lifecycle-maintenance = "crypto_scanner.lifecycle_maintenance:main"
crypto-scanner-private-ws-probe = "crypto_scanner.private_ws_probe:main"
crypto-scanner-phase7-audit = "crypto_scanner.phase7_audit:main"
crypto-scanner-persistence-smoke = "crypto_scanner.persistence_smoke:main"
crypto-scanner-linkage-cycle = "crypto_scanner.linkage_cycle:main"
crypto-scanner-cycle = "crypto_scanner.scanner_cycle:main"
crypto-scanner-heartbeat = "crypto_scanner.runtime_health:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_scanner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
