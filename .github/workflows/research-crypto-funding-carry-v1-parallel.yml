name: Research Crypto Funding Carry V1 Parallel

on:
  workflow_dispatch:
  push:
    branches:
      - research/crypto-funding-carry-v1
    paths:
      - "src/crypto_scanner/run_funding_carry_research_parallel.py"
      - ".github/workflows/research-crypto-funding-carry-v1-parallel.yml"

permissions:
  contents: read

jobs:
  historical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==8.4.2 ruff==0.12.12
      - name: Lint and tests
        run: |
          ruff check src/crypto_scanner/funding_carry_research.py src/crypto_scanner/run_funding_carry_research.py src/crypto_scanner/run_funding_carry_research_parallel.py tests/test_funding_carry_research.py
          pytest -q tests/test_funding_carry_research.py
      - name: Run frozen historical screen with parallel archive loading
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.run_funding_carry_research_parallel | tee crypto_funding_carry_v1.json
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("crypto_funding_carry_v1.json").read_text().splitlines()[-1])
          assert data["schema_version"] == "CRYPTO_FUNDING_CARRY_V1"
          assert data["research_only"] is True
          assert data["execution_influence"] is False
          assert data["live_execution_enabled"] is False
          assert data["oos_used_for_selection"] is False
          assert len(data["universe"]) == 20
          print("CRYPTO_FCR_HISTORICAL_PASS", data["historical_pass"])
          for row in data["rows"]:
              va = row["stress"]["validation"]
              oo = row["stress"]["oos"]
              print("CRYPTO_FCR_ROW", row["candidate"], "val_return=", va["total_return"], "val_sharpe=", va["annualized_sharpe"], "val_dd=", va["max_drawdown"], "oos_return=", oo["total_return"], "oos_sharpe=", oo["annualized_sharpe"], "oos_dd=", oo["max_drawdown"], "oos_bootstrap=", oo["bootstrap_positive_fraction_200"], "pass=", row["historical_pass"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-funding-carry-v1-parallel
          path: crypto_funding_carry_v1.json
          if-no-files-found: error
          retention-days: 30
