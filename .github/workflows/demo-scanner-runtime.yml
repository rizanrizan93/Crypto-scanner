name: Crypto Scanner Demo Runtime

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/demo-scanner-runtime.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      enable_demo_orders:
        description: "Allow one explicitly requested Binance Demo entry cycle"
        required: true
        type: boolean
        default: false
      continuous_window:
        description: "Run the managed twelve-cycle acquisition window"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Every exchange-writing strategy is serialized through one account-wide writer lock.
concurrency:
  group: crypto-scanner-demo-runtime-scanner
  cancel-in-progress: false

jobs:
  scanner-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BINANCE_DEMO_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
      BINANCE_DEMO_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
      CRYPTO_SCANNER_SUPABASE_URL: ${{ secrets.CRYPTO_SCANNER_SUPABASE_URL }}
      CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BINANCE_DEMO_API_KEY}"
          test -n "${BINANCE_DEMO_API_SECRET}"
          test -n "${CRYPTO_SCANNER_SUPABASE_URL}"
          test -n "${CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY}"
      - name: Heartbeat running
        continue-on-error: true
        run: crypto-scanner-heartbeat SCANNER_CYCLE RUNNING
      - name: Clean scanner-owned flat-symbol protectors
        env:
          CRYPTO_SCANNER_TESTNET_EXECUTION: ENABLED
        run: crypto-scanner-lifecycle-maintenance
      - name: Disarmed Phase 6 pre-audit
        env:
          CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
        run: crypto-scanner-phase6-audit
      - name: Promote regime specialist to Forward Demo
        run: python -m crypto_scanner.manual_regime_specialist_promotion
      - name: Run Demo acquisition and calibration-data cycle
        # Demo/Testnet remains the research collection environment. Historical
        # HISTORICAL_PENDING/HISTORICAL_REJECTED data remain collection-only and do
        # not receive FORWARD_DEMO promotion credit. QUARANTINED remains fail-closed.
        # The durable strategy pool may validate or demote each lane independently;
        # it cannot unlock LIVE or real-money trading.
        env:
          CRYPTO_SCANNER_TESTNET_EXECUTION: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_demo_orders)) && 'ENABLED' || 'DISABLED' }}
          CRYPTO_SCANNER_DEMO_DATA_COLLECTION: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_demo_orders)) && 'ENABLED' || 'DISABLED' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CRYPTO_SCANNER_TESTNET_EXECUTION}" != "ENABLED" ]; then
            echo "Push validation is disarmed; strategy configuration only."
            exit 0
          fi

          total_cycles=12
          profit_lock_tick_seconds=60
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] && [ "${{ inputs.continuous_window }}" != "true" ]; then
            total_cycles=1
          fi

          protect_and_fail() {
            CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED crypto-scanner-profit-lock-watch
            exit 1
          }

          for cycle in $(seq 1 "${total_cycles}"); do
            cycle_started=$(date +%s)
            echo "=== Multi-strategy Demo cycle ${cycle}/${total_cycles} ==="
            CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED crypto-scanner-lifecycle-maintenance

            echo "--- Regime Specialist 28D25 ---"
            CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED \
              python -m crypto_scanner.strategy_pool_cycle \
              strategy-regime-specialist-28d25-v1 || protect_and_fail
            CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED crypto-scanner-profit-lock-watch

            # The D1 volatility-breakout leg is stable for the day, but its
            # microstructure entry gate is intraday. Re-evaluate the already-active
            # leg on every five-minute acquisition cycle so a safe retest/trigger is
            # not missed merely because it did not occur in the first cycle of the
            # hourly window. Existing symbol exposure and durable execution dedupe
            # remain authoritative, so this increases observation opportunity rather
            # than relaxing entry/risk thresholds.
            echo "--- Volatility Breakout 30/15 VT20 ---"
            CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED \
              python -m crypto_scanner.strategy_pool_cycle \
              strategy-vol-breakout-30-15-vt20-v1 || protect_and_fail
            CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED crypto-scanner-profit-lock-watch

            # Funding/OI is an hourly signal lane and remains once per acquisition
            # window to avoid redundant external-data work.
            if [ "${cycle}" -eq 1 ]; then
              echo "--- Funding Z2 + OI expansion >=2% ---"
              CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED \
                python -m crypto_scanner.strategy_pool_cycle \
                strategy-funding-z2-oi2-v1 || protect_and_fail
              CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED crypto-scanner-profit-lock-watch
            fi

            crypto-scanner-heartbeat SCANNER_CYCLE RUNNING || true

            if [ "${cycle}" -lt "${total_cycles}" ]; then
              cycle_finished=$(date +%s)
              elapsed=$((cycle_finished - cycle_started))
              remaining=$((300 - elapsed))

              while [ "${remaining}" -gt "${profit_lock_tick_seconds}" ]; do
                sleep "${profit_lock_tick_seconds}"
                CRYPTO_SCANNER_TESTNET_EXECUTION=ENABLED crypto-scanner-profit-lock-watch
                cycle_finished=$(date +%s)
                elapsed=$((cycle_finished - cycle_started))
                remaining=$((300 - elapsed))
              done

              if [ "${remaining}" -gt 0 ]; then
                sleep "${remaining}"
              fi
            fi
          done
      - name: Disarmed Phase 6 post-audit
        if: always()
        env:
          CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
        run: crypto-scanner-phase6-audit
      - name: Heartbeat success
        if: success()
        continue-on-error: true
        run: crypto-scanner-heartbeat SCANNER_CYCLE SUCCESS
      - name: Heartbeat failed
        if: failure()
        continue-on-error: true
        run: crypto-scanner-heartbeat SCANNER_CYCLE FAILED
