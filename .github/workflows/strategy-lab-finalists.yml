name: Crypto Strategy Lab Finalists

on:
  push:
    branches:
      - main
    paths:
      - "research/strategy_lab_finalists.py"
      - ".github/workflows/strategy-lab-finalists.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-strategy-lab-finalists
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run finalist robustness lab
        run: python research/strategy_lab_finalists.py --output strategy_lab_finalists_results.json
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-finalists-results
          path: strategy_lab_finalists_results.json
          retention-days: 7
