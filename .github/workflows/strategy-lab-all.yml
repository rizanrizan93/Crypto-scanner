name: Crypto Strategy Lab All

on:
  push:
    branches:
      - main
    paths:
      - "research/strategy_lab_all.py"
      - ".github/workflows/strategy-lab-all.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-strategy-lab-all
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run comprehensive strategy lab
        run: python research/strategy_lab_all.py --output strategy_lab_results.json

      - name: Print audit summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r = json.load(open("strategy_lab_results.json", encoding="utf-8"))
          compact = {
              "method": r["method"],
              "validation_qualified": r["validation_qualified"],
              "strategies": {
                  name: {
                      "overall": row["overall"],
                      "validation": row["validation"],
                      "oos": row["oos"],
                      "avg_gross_exposure": row["avg_gross_exposure"],
                      "annual_turnover": row["annual_turnover"],
                      "funding_contribution": row["funding_contribution"],
                      "oos_corr_to_current": row["oos_corr_to_current_regime_specialist"],
                      "cost_stress": row["cost_stress"],
                  }
                  for name, row in r["strategies"].items()
              },
              "adaptive_top3_180d": r["adaptive_top3_180d"],
              "fixed_regime_router": r["fixed_regime_router"],
              "oi_confirmed_dislocation_recent": r["oi_confirmed_dislocation_recent"],
              "coinmetrics_reference_2012_2026": r["coinmetrics_reference_2012_2026"],
          }
          print("STRATEGY_LAB_AUDIT=" + json.dumps(compact, separators=(",", ":"), sort_keys=True))
          PY

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-all-results
          path: strategy_lab_results.json
          retention-days: 7
