name: Crypto Scanner Demo Promotion Runtime

on:
  push:
    branches:
      - main
    paths:
      - "src/crypto_scanner/strategy_params.py"
      - "src/crypto_scanner/strategy_promotion.py"
      - "src/crypto_scanner/strategy_promotion_runtime.py"
      - ".github/workflows/demo-promotion-runtime.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-scanner-demo-runtime-promotion
  cancel-in-progress: false

jobs:
  promotion-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRYPTO_SCANNER_SUPABASE_URL: ${{ secrets.CRYPTO_SCANNER_SUPABASE_URL }}
      CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
      CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRYPTO_SCANNER_SUPABASE_URL}"
          test -n "${CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY}"
      - name: Heartbeat running
        continue-on-error: true
        run: crypto-scanner-heartbeat PROMOTION_CYCLE RUNNING
      - name: Evaluate historical and forward-Demo promotion gates
        run: crypto-scanner-strategy-promote
      - name: Heartbeat success
        if: success()
        continue-on-error: true
        run: crypto-scanner-heartbeat PROMOTION_CYCLE SUCCESS
      - name: Heartbeat failed
        if: failure()
        continue-on-error: true
        run: crypto-scanner-heartbeat PROMOTION_CYCLE FAILED
