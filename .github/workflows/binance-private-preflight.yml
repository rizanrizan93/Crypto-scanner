name: Binance Private Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - verify/current-phase6-state
    paths:
      - .github/workflows/binance-private-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BINANCE_DEMO_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
      BINANCE_DEMO_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
      CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BINANCE_DEMO_API_KEY}" || {
            echo "BINANCE_DEMO_API_KEY secret is missing"
            exit 1
          }
          test -n "${BINANCE_DEMO_API_SECRET}" || {
            echo "BINANCE_DEMO_API_SECRET secret is missing"
            exit 1
          }
      - name: Run disarmed authenticated preflight
        run: crypto-scanner-runtime-preflight
      - name: Run Phase 6 protection audit
        run: crypto-scanner-phase6-audit
