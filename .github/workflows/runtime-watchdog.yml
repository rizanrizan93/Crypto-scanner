name: Crypto Scanner Runtime Watchdog

on:
  push:
    branches:
      - main
    paths:
      - "src/crypto_scanner/runtime_watchdog.py"
      - "pyproject.toml"
      - ".github/workflows/runtime-watchdog.yml"
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-scanner-demo-runtime-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRYPTO_SCANNER_SUPABASE_URL: ${{ secrets.CRYPTO_SCANNER_SUPABASE_URL }}
      CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
      CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRYPTO_SCANNER_SUPABASE_URL}"
          test -n "${CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY}"
      - name: Heartbeat running
        continue-on-error: true
        run: crypto-scanner-heartbeat WATCHDOG_CYCLE RUNNING
      - name: Require fresh scanner, trajectory, calibration, and promotion runtimes
        run: crypto-scanner-runtime-watchdog
      - name: Heartbeat success
        if: success()
        continue-on-error: true
        run: crypto-scanner-heartbeat WATCHDOG_CYCLE SUCCESS
      - name: Heartbeat failed
        if: failure()
        continue-on-error: true
        run: crypto-scanner-heartbeat WATCHDOG_CYCLE FAILED
