name: Crypto Scanner Demo Calibration Runtime

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-scanner-demo-runtime-calibration
  cancel-in-progress: false

jobs:
  calibration-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRYPTO_SCANNER_SUPABASE_URL: ${{ secrets.CRYPTO_SCANNER_SUPABASE_URL }}
      CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
      CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRYPTO_SCANNER_SUPABASE_URL}"
          test -n "${CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY}"
      - name: Heartbeat running
        continue-on-error: true
        run: crypto-scanner-heartbeat CALIBRATION_CYCLE RUNNING
      - name: Evaluate historical and forward-Demo promotion gates
        run: crypto-scanner-strategy-promote
      - name: Calibrate from actual Demo data
        # If there is no champion yet and the candidate is HISTORICAL_REJECTED,
        # calibration uses that candidate's own eligible closed Demo trades to
        # build a bounded challenger. These trades do not receive FORWARD_DEMO credit.
        run: crypto-scanner-calibrate-demo-data
      - name: Analyze research factor attribution
        run: crypto-scanner-research-attribution
      - name: Heartbeat success
        if: success()
        continue-on-error: true
        run: crypto-scanner-heartbeat CALIBRATION_CYCLE SUCCESS
      - name: Heartbeat failed
        if: failure()
        continue-on-error: true
        run: crypto-scanner-heartbeat CALIBRATION_CYCLE FAILED
