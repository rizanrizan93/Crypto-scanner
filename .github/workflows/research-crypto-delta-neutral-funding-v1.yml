name: Research Crypto Delta Neutral Funding V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/crypto-delta-neutral-funding-carry-v1
    paths:
      - "src/crypto_scanner/delta_neutral_funding_research.py"
      - "tests/test_delta_neutral_funding_research.py"
      - ".github/workflows/research-crypto-delta-neutral-funding-v1.yml"

permissions:
  contents: read

concurrency:
  group: research-crypto-delta-neutral-funding-v1
  cancel-in-progress: true

jobs:
  historical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==8.4.2 ruff==0.12.12
      - name: Lint
        run: |
          ruff check src/crypto_scanner/delta_neutral_funding_research.py \
            tests/test_delta_neutral_funding_research.py
      - name: Unit tests
        run: pytest -q tests/test_delta_neutral_funding_research.py
      - name: Run frozen delta-neutral funding screen
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.delta_neutral_funding_research | tee crypto_delta_neutral_funding_v1.log
          tail -n 1 crypto_delta_neutral_funding_v1.log > crypto_delta_neutral_funding_v1.json
      - name: Verify immutable evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("crypto_delta_neutral_funding_v1.json").read_text())
          assert data["schema_version"] == "CRYPTO_DELTA_NEUTRAL_FUNDING_CARRY_V1"
          assert data["research_only"] is True
          assert data["execution_influence"] is False
          assert data["live_execution_enabled"] is False
          assert data["selection_partition"] == "validation"
          assert data["oos_used_for_selection"] is False
          assert data["costs"]["stress_round_trip_bps_on_gross"] == 25.0
          print("CRYPTO_DNC_HISTORICAL_PASS", data["historical_pass"])
          print("CRYPTO_DNC_VALIDATION_RANKING", data["validation_ranking"])
          for row in data["rows"]:
              va = row["stress"]["validation"]
              oo = row["stress"]["oos"]
              severe = row["severe"]["oos"]
              print(
                  "CRYPTO_DNC_ROW", row["candidate"],
                  "val_return=", va["total_return"],
                  "val_sharpe=", va["annualized_sharpe"],
                  "val_dd=", va["max_drawdown"],
                  "oos_return=", oo["total_return"],
                  "oos_sharpe=", oo["annualized_sharpe"],
                  "oos_dd=", oo["max_drawdown"],
                  "oos_bootstrap=", oo["bootstrap_positive_fraction_200"],
                  "severe_oos_return=", severe["total_return"],
                  "pass=", row["historical_pass"],
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-delta-neutral-funding-v1
          path: crypto_delta_neutral_funding_v1.json
          if-no-files-found: error
          retention-days: 30
