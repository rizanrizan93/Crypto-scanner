name: Research Crypto Funding Carry Robustness Fast V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/crypto-funding-carry-v1
    paths:
      - "src/crypto_scanner/funding_carry_robustness_fast_research.py"
      - ".github/workflows/research-crypto-funding-carry-robustness-fast-v1.yml"

permissions:
  contents: read

jobs:
  robustness-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff==0.12.12
      - name: Lint
        run: ruff check --ignore E501 src/crypto_scanner/funding_carry_robustness_fast_research.py
      - name: Run optimized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.funding_carry_robustness_fast_research | tee crypto_funding_carry_robustness_fast_v1.log
          tail -n 1 crypto_funding_carry_robustness_fast_v1.log > crypto_funding_carry_robustness_fast_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-funding-carry-robustness-fast-v1
          path: crypto_funding_carry_robustness_fast_v1.json
          if-no-files-found: error
          retention-days: 30
