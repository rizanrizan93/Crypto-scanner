name: Research Crypto Squeeze Breakout V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/crypto-squeeze-breakout-v1
    paths:
      - "src/crypto_scanner/squeeze_breakout_signal.py"
      - "src/crypto_scanner/squeeze_breakout_engine.py"
      - "src/crypto_scanner/run_squeeze_breakout_research.py"
      - "tests/test_squeeze_breakout_research.py"
      - "research/squeeze_breakout_v1_*.json"
      - ".github/workflows/research-crypto-squeeze-breakout-v1.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff==0.12.12
      - name: Lint
        run: ruff check --ignore E501,I001 src/crypto_scanner/squeeze_breakout_signal.py src/crypto_scanner/squeeze_breakout_engine.py src/crypto_scanner/run_squeeze_breakout_research.py tests/test_squeeze_breakout_research.py
      - name: Unit tests
        run: pytest -q tests/test_squeeze_breakout_research.py
      - name: Frozen historical screen
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.run_squeeze_breakout_research | tee squeeze_breakout_v1.log
          tail -n 1 squeeze_breakout_v1.log > squeeze_breakout_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('squeeze_breakout_v1.json').read_text())
          assert d['schema_version']=='CRYPTO_SQUEEZE_BREAKOUT_V1'
          assert d['research_only'] is True
          assert d['execution_influence'] is False
          assert d['live_execution_enabled'] is False
          assert d['oos_used_for_selection'] is False
          print('SQZ_HISTORICAL_PASS',d['historical_pass'])
          for r in d['rows']:
              v=r['stress']['validation']; o=r['stress']['oos']; s=r['severe_25bps']['oos']
              print('SQZ_ROW',r['candidate'],'val_n=',v['closed_trades'],'val_exp=',v['expectancy_r'],'val_pf=',v['profit_factor'],'oos_n=',o['closed_trades'],'oos_exp=',o['expectancy_r'],'oos_pf=',o['profit_factor'],'oos_dd=',o['max_drawdown_r'],'oos_boot=',o['bootstrap_positive_fraction_200'],'severe25_exp=',s['expectancy_r'],'pass=',r['historical_pass'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-squeeze-breakout-v1
          path: squeeze_breakout_v1.json
          if-no-files-found: error
          retention-days: 30
