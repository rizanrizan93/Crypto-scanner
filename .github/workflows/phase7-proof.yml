name: Phase 7 Trajectory Proof

on:
  push:
    branches:
      - feat/demo-periodic-runtime
    paths:
      - .github/workflows/phase7-proof.yml

permissions:
  contents: read

jobs:
  phase7-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_DEMO_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
      BINANCE_DEMO_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
      CRYPTO_SCANNER_SUPABASE_URL: ${{ secrets.CRYPTO_SCANNER_SUPABASE_URL }}
      CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
      CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
      CRYPTO_SCANNER_PHASE7_CLOSED_LIMIT: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run Phase 7 trajectory proof
        run: crypto-scanner-phase7-audit
