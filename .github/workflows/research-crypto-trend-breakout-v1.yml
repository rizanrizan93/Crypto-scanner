name: Research Crypto Trend Breakout V1

on:
  push:
    branches:
      - research/crypto-trend-breakout-v1
    paths:
      - "src/crypto_scanner/trend_breakout_research.py"
      - "src/crypto_scanner/run_trend_breakout_research.py"
      - "tests/test_trend_breakout_research.py"
      - ".github/workflows/research-crypto-trend-breakout-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-crypto-trend-breakout-v1
  cancel-in-progress: true

jobs:
  historical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: pytest -q tests/test_trend_breakout_research.py
      - name: Run official-archive historical screen
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.run_trend_breakout_research | tee crypto_trend_breakout_v1.json
      - name: Print evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("crypto_trend_breakout_v1.json").read_text())
          assert data["research_only"] is True
          assert data["execution_influence"] is False
          assert data["oos_used_for_selection"] is False
          print("CRYPTO_TREND_HISTORICAL_PASS", data["historical_pass"])
          for row in data["rows"][:15]:
              v = row["stress"]["validation"]
              o = row["stress"]["oos"]
              print(
                  "CRYPTO_TREND_ROW",
                  row["symbol"], row["candidate"],
                  "validation_n=", v["trades"],
                  "validation_exp=", v["expectancy_r"],
                  "validation_pf=", v["profit_factor"],
                  "oos_n=", o["trades"],
                  "oos_exp=", o["expectancy_r"],
                  "oos_pf=", o["profit_factor"],
                  "oos_dd=", o["max_drawdown_r"],
                  "pass=", row["historical_pass"],
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-trend-breakout-v1
          path: crypto_trend_breakout_v1.json
          if-no-files-found: error
