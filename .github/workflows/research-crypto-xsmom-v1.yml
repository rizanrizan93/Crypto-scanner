name: Research Crypto Cross-Sectional Momentum V1

on:
  push:
    branches:
      - research/crypto-cross-sectional-momentum-v1
    paths:
      - "src/crypto_scanner/cross_sectional_momentum_research.py"
      - "src/crypto_scanner/run_cross_sectional_momentum_research.py"
      - "tests/test_cross_sectional_momentum_research.py"
      - ".github/workflows/research-crypto-xsmom-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-crypto-xsmom-v1
  cancel-in-progress: true

jobs:
  historical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==8.4.2
      - name: Unit tests
        run: pytest -q tests/test_cross_sectional_momentum_research.py
      - name: Run official-archive historical screen
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.run_cross_sectional_momentum_research | tee crypto_xsmom_v1.json
      - name: Print evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("crypto_xsmom_v1.json").read_text())
          assert data["research_only"] is True
          assert data["execution_influence"] is False
          assert data["oos_used_for_selection"] is False
          print("CRYPTO_XSMOM_HISTORICAL_PASS", data["historical_pass"])
          for row in data["rows"]:
              v = row["stress"]["validation"]
              o = row["stress"]["oos"]
              print(
                  "CRYPTO_XSMOM_ROW",
                  row["candidate"],
                  "validation_days=", v["days"],
                  "validation_return=", v["total_return"],
                  "validation_sharpe=", v["annualized_sharpe"],
                  "validation_dd=", v["max_drawdown"],
                  "oos_days=", o["days"],
                  "oos_return=", o["total_return"],
                  "oos_sharpe=", o["annualized_sharpe"],
                  "oos_dd=", o["max_drawdown"],
                  "oos_bootstrap_positive=", o["bootstrap_positive_fraction_100"],
                  "pass=", row["historical_pass"],
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-xsmom-v1
          path: crypto_xsmom_v1.json
          if-no-files-found: error
