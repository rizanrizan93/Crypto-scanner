name: Research Crypto Quarter-Hour OFI V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/crypto-quarter-hour-ofi-v1
    paths:
      - "src/crypto_scanner/quarter_hour_ofi_core.py"
      - "src/crypto_scanner/quarter_hour_ofi_data.py"
      - "src/crypto_scanner/run_quarter_hour_ofi_research.py"
      - "tests/test_quarter_hour_ofi_research.py"
      - "research/quarter_hour_ofi_v1_*.json"
      - ".github/workflows/research-crypto-quarter-hour-ofi-v1.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff==0.12.12
      - name: Lint
        run: ruff check --ignore E501 src/crypto_scanner/quarter_hour_ofi_core.py src/crypto_scanner/quarter_hour_ofi_data.py src/crypto_scanner/run_quarter_hour_ofi_research.py tests/test_quarter_hour_ofi_research.py
      - name: Unit tests
        run: pytest -q tests/test_quarter_hour_ofi_research.py
      - name: Frozen historical screen
        shell: bash
        run: |
          set -euo pipefail
          python -m crypto_scanner.run_quarter_hour_ofi_research | tee quarter_hour_ofi_v1.log
          tail -n 1 quarter_hour_ofi_v1.log > quarter_hour_ofi_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('quarter_hour_ofi_v1.json').read_text())
          assert d['schema_version']=='CRYPTO_QUARTER_HOUR_OFI_V1'
          assert d['research_only'] is True
          assert d['execution_influence'] is False
          assert d['live_execution_enabled'] is False
          assert d['oos_used_for_selection'] is False
          print('QH_HISTORICAL_PASS', d['historical_pass'])
          for r in d['rows']:
              v=r['stress']['validation']; o=r['stress']['oos']; s=r['severe_25bps']['oos']
              print('QH_ROW', r['candidate'], 'val_ret=',v['total_return'],'val_sh=',v['annualized_sharpe'],'val_n=',v['closed_trades'],'oos_ret=',o['total_return'],'oos_sh=',o['annualized_sharpe'],'oos_dd=',o['max_drawdown'],'oos_boot=',o['bootstrap_positive_fraction_200'],'severe25=',s['total_return'],'pass=',r['historical_pass'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-quarter-hour-ofi-v1
          path: quarter_hour_ofi_v1.json
          if-no-files-found: error
          retention-days: 30
