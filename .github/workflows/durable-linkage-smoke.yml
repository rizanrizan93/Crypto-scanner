name: Durable Trade Linkage Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkage-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRYPTO_SCANNER_TESTNET_EXECUTION: DISABLED
      CRYPTO_SCANNER_SUPABASE_URL: ${{ secrets.CRYPTO_SCANNER_SUPABASE_URL }}
      CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRYPTO_SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Persist discovery through signal geometry
        run: crypto-scanner-linkage-cycle
