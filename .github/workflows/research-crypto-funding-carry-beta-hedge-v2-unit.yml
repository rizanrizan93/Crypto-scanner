name: Research Crypto Funding Carry Beta Hedge V2 Unit

on:
  workflow_dispatch:
  push:
    branches:
      - research/crypto-funding-carry-v1
    paths:
      - "tests/test_funding_carry_beta_hedge_research.py"
      - ".github/workflows/research-crypto-funding-carry-beta-hedge-v2-unit.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==8.4.2
      - name: Unit tests
        run: pytest -q tests/test_funding_carry_beta_hedge_research.py
